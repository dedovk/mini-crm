name: Marketplace CRM sync

on:
  schedule:
    # DirectAdmin dispatches the frequent 15-minute runs. Keep one GitHub-hosted
    # daily deep reconciliation to catch TTNs added to older orders.
    - cron: "13 2 * * *"
      timezone: "Europe/Kyiv"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate without writing to Google Sheets"
        required: false
        default: false
        type: boolean
      lookback_days:
        description: "Order history window for a manual diagnostic run"
        required: false
        default: "7"
        type: string

concurrency:
  group: marketplace-crm-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_WORKSHEET_NAME: ${{ secrets.GOOGLE_WORKSHEET_NAME }}
      GOOGLE_HEADER_ROW: "4"
      PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
      PROM_API_BASE_URL: "https://my.prom.ua/api/v1"
      ROZETKA_API_TOKEN: ${{ secrets.ROZETKA_API_TOKEN }}
      ROZETKA_USERNAME: ${{ secrets.ROZETKA_USERNAME }}
      ROZETKA_PASSWORD: ${{ secrets.ROZETKA_PASSWORD }}
      ROZETKA_API_BASE_URL: "https://api-seller.rozetka.com.ua"
      OPENCART_BASE_URL: ${{ secrets.OPENCART_BASE_URL }}
      OPENCART_API_KEY: ${{ secrets.OPENCART_API_KEY }}
      OPENCART_ORDERS_ENDPOINT: "/index.php?route=api/crm_orders"
      NP_API_TOKEN: ${{ secrets.NP_API_TOKEN }}
      NOVA_POSHTA_API_URL: "https://api.novaposhta.ua/v2.0/json/"
      APP_TIMEZONE: ${{ secrets.APP_TIMEZONE }}
      # Frequent runs fetch seven days to reduce Prom API usage. The daily run
      # reconciles the full 30-day history.
      SYNC_LOOKBACK_DAYS: ${{ github.event.schedule == '13 2 * * *' && '30' || inputs.lookback_days || '7' }}
      # Deep runs may inspect older orders, but they must not backfill stale
      # missing orders into the current reporting day.
      NEW_ORDER_MAX_AGE_DAYS: "7"
      ROZETKA_FINANCE_LOOKBACK_DAYS: ${{ github.event.schedule == '13 2 * * *' && '90' || '45' }}
      HTTP_TIMEOUT_SECONDS: "30"
      HTTP_MAX_RETRIES: "4"
      LOG_LEVEL: "INFO"
      SENDER_DEFAULT: "наш"
      SENDER_OPTIONS: ${{ secrets.SENDER_OPTIONS || 'imaxi-com,Melad,Melad дроп,наш' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Synchronize orders
        run: python -m crm_sync.main
        env:
          PYTHONPATH: src
